name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Functions image (AMD64 only)
        uses: docker/build-push-action@v5
        with:
          context: ./CoffeeNChill/CoffeeNChill.Functions
          push: true
          tags: phomeleloprosper/coffeenchill-functions:v2.0
          platforms: linux/amd64

      - name: Build and push Gateway image (Multi-platform)
        uses: docker/build-push-action@v5
        with:
          context: ./CoffeeNChill.Gateway/CoffeeNChill.Gateway
          push: true
          tags: phomeleloprosper/coffeenchill-gateway:v1.0
          platforms: linux/amd64,linux/arm64